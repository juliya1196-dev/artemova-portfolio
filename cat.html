<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your Reward — Julia Artemova</title>
<meta name="description" content="A reward for scrolling to the very end of Julia Artemova's portfolio: her cat, Flinn." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #121010;
    --card: #191614;
    --ink: #F5EFE3;
    --ink-soft: #C7BFAE;
    --ink-faint: #8A8271;
    --accent: #FF6B3D;
    --line: rgba(245,239,227,0.14);
    --line-strong: rgba(245,239,227,0.36);

    --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  a { color: inherit; }
  .wrap { max-width: 980px; margin-inline: auto; padding-inline: clamp(18px, 5vw, 48px); }
  h1 { font-family: var(--font-display); font-weight: 440; margin: 0; text-wrap: balance; }
  .accent { color: var(--accent); font-style: italic; }

  .backbar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .backlink {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em;
    color: var(--ink-soft); text-decoration: none; padding-block: 16px;
  }
  .backlink:hover { color: var(--ink); }

  .eyebrow { font-family: var(--font-mono); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--ink-soft); }

  .reward { padding-block: clamp(40px, 7vw, 72px) clamp(48px, 7vw, 88px); text-align: center; }
  .reward h1 { font-size: clamp(2.4rem, 1.9rem + 3.2vw, 4rem); line-height: 1.05; margin-top: 14px; }
  .cat { margin: clamp(32px, 5vw, 48px) auto 0; width: min(100%, 560px); }
  .cat img { display: block; width: 100%; height: auto; border-radius: 18px; }
  .cat figcaption { margin-top: 18px; font-family: var(--font-display); font-style: italic; font-size: clamp(1.15rem, 1rem + 0.6vw, 1.45rem); color: var(--ink); }

  footer.site { padding-block: 22px; }
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
</style>
</head>
<body>

  <div class="backbar">
    <div class="wrap">
      <a class="backlink" href="./">&larr; Back to Portfolio</a>
    </div>
  </div>

  <main class="reward wrap">
    <span class="eyebrow">Thanks for making it till the end</span>
    <h1>Here is your <span class="accent">reward</span></h1>
    <figure class="cat">
      <img src="cat-flinn.webp" width="1086" height="1448" alt="Flinn, a long-haired grey Maine Coon, sitting on a black stand against a dark background and looking straight at the camera" />
      <figcaption>My cat Flinn :-)</figcaption>
    </figure>
  </main>

  <footer class="site">
    <div class="wrap foot-row">
      <span>© 2026 Julia Artemova</span>
      <span>Senior Creative &amp; Graphic Designer / Art&nbsp;Director — Amsterdam, NL</span>
    </div>
  </footer>

</body>
</html>
